<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Login - Yellow Cicy</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header>

    <div class="container">

        <div class="logo">

            <a href="index.html">

                <img
                    src="images/logo.png"
                    alt="Yellow Cicy"
                >

            </a>

            <h1>
                Yellow Cicy
            </h1>

        </div>

    </div>

</header>


<nav>

    <ul>

        <li>
            <a href="index.html">
                Home
            </a>
        </li>

        <li>
            <a href="index.html#products">
                Shop
            </a>
        </li>

        <li>
            <a href="cart.html">
                Cart
            </a>
        </li>

        <li>
            <a href="account.html">
                Account
            </a>
        </li>

    </ul>

</nav>


<main class="account-page">

    <h1>
        Customer Account
    </h1>


    <div class="account-card">

        <h2 id="form-title">
            Login
        </h2>


        <input
            type="email"
            id="email"
            placeholder="Email address"
            autocomplete="email"
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >


        <button
            type="button"
            id="login-btn"
            class="account-button"
        >
            🔐 Login
        </button>


        <button
            type="button"
            id="register-btn"
            class="account-button"
        >
            📝 Create Account
        </button>


        <p
            id="login-message"
            style="
                text-align:center;
                margin-top:15px;
            "
        ></p>


        <p
            style="
                text-align:center;
                margin-top:20px;
            "
        >
            <a href="index.html">
                Back to Store
            </a>
        </p>

    </div>

</main>


<footer>

    <p>
        © 2026 Yellow Cicy. All rights reserved.
    </p>

</footer>


<script
    type="module"
    src="js/customer-login.js"
></script>


</body>

</html>
