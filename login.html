<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - Yellow Cicy</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="admin">

    <h1>Yellow Cicy Admin</h1>

    <h2>Admin Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Admin Email"
        autocomplete="email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button id="login-btn">
        Login
    </button>

    <p
        id="login-message"
        style="text-align:center;margin-top:15px;"
    ></p>

    <p style="text-align:center;margin-top:20px;">

        <a href="index.html">
            Back to Store
        </a>

    </p>

</div>


<script
    type="module"
    src="js/login.js"
></script>

</body>

</html>
